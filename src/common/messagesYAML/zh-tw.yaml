moduleCheckRemoteSize:
  logCheckingStorageSizes: 正在檢查儲存空間大小
  logCurrentStorageSize: "遠端儲存空間大小：${measuredSize}"
  logExceededWarning: "遠端儲存空間大小：${measuredSize} 已超過 ${notifySize}"
  logThresholdEnlarged: 閾值已提高到 ${size}MB
  msgConfirmRebuild: 這可能需要一些時間。你確定要現在重建全部內容嗎？
  msgDatabaseGrowing: |-
    **你的資料庫正在變大！** 但不用擔心，我們現在就可以處理。在遠端儲存空間用盡之前還有一些時間。

    | 測量大小 | 設定大小 |
    | --- | --- |
    | ${estimatedSize} | ${maxSize} |

    > [!MORE]-
    > 如果你已經使用了好幾年，資料庫中可能累積了未被參照的 chunks，也就是垃圾資料。因此，我們建議重建全部內容，通常會讓資料庫變得小很多。
    >
    > 如果你的 Vault 容量只是持續增加，最好先整理檔案再重建全部內容。即使你為了加快速度而刪除了檔案，Self-hosted LiveSync 也不會刪除實際資料，詳情大致記載在[文件](https://github.com/vrtmrz/obsidian-livesync/blob/main/docs/tech_info.md)中。
    >
    > 如果你不在意容量增加，可以將通知上限調高 100MB，這在你自行架設伺服器時較適用。不過，還是建議偶爾重建全部內容。
    >

    > [!WARNING]
    > 若要執行重建全部內容，請確保所有裝置都已同步。不過外掛會盡可能地進行合併。
  msgSetDBCapacity: |-
    我們可以設定資料庫容量上限警告，**以便在遠端儲存空間用盡之前及早採取行動**。
    你要啟用這個功能嗎？

    > [!MORE]-
    > - 0：不警告儲存空間大小。
    >   如果你在遠端儲存空間（尤其是自行架設）有足夠空間，建議選擇此項；你也可以自行手動檢查儲存空間大小並重建。
    > - 800：遠端儲存空間大小超過 800MB 時警告。
    >   如果你使用限制為 1GB 的 fly.io 或 IBM Cloudant，建議選擇此項。
    > - 2000：遠端儲存空間大小超過 2GB 時警告。

    如果達到上限，系統會要求逐步提高限制。
  noticeExceeded: "遠端儲存空間大小為 ${measuredSize}，已超過設定的 ${notifySize} 通知閾值。{HERE}"
  noticeNotConfigured: 尚未設定遠端儲存空間大小通知。{HERE}
