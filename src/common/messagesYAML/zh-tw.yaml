  fix0256:
    buttons:
      checkItLater: 稍後再檢查
      DismissForever: 我已修正，不要再詢問
      fix: 修正
    message: |
      由於近期的一個問題（存在於 v0.25.6），部分檔案可能未正確儲存到同步資料庫中。
      我們已掃描你的檔案，並找出一些需要修正的項目。

      **可以修正的檔案：**

      ${files}

      這些檔案在儲存空間中有大小相符的原始檔案，很可能可以復原。
      我們可以用它們修正資料庫，請點選下方的「修正」按鈕進行修正。

      ${messageUnrecoverable}

      如果你想再次執行，可以從 Hatch 頁面操作。
    messageUnrecoverable: |
      **無法在此裝置上修正的檔案：**

      ${filesNotRecoverable}

      這些檔案的中繼資料不一致，無法在此裝置上修正（多數情況下我們無法判斷哪一份才正確）。
      若要復原它們，請檢查你的其他裝置（同樣使用此功能），或從備份手動復原。
    title: 已偵測到損壞的檔案
  insecureChunkExist:
    buttons:
      fetch: 我已重建遠端，從遠端抓取
      later: 我稍後再處理
      rebuild: 重建全部
    laterMessage: 我們強烈建議盡快處理此問題！
    message: |
      部分 chunks 未安全儲存，在資料庫中也未加密。
      **請重建資料庫以修正此問題**。

      如果你的遠端資料庫未設定 SSL，或使用了安全性較低的憑證，**敏感資料就有外洩風險**。

      注意：請將所有裝置上的 Self-hosted LiveSync 升級到 v0.25.6 或更新版本，並確實備份你的 Vault。
      注意 2：重建全部與抓取會耗用一些時間與流量，請在離峰時段進行，並確保網路連線穩定。
    title: 發現不安全的 chunks！
  logBulkSendCorrupted: 已啟用批次傳送 chunks，但此功能已損壞。造成不便，敬請見諒。已自動停用。
  logFetchRemoteTweakFailed: 無法取得遠端調校值
  logLocalDatabaseNotReady: 發生問題！本機資料庫尚未就緒
  logMigratedSameBehaviour: "已遷移到 db:${current}，行為與先前相同"
  logMigrationFailed: "從 ${old} 遷移到 ${current} 失敗或已取消"
  logRedflag2CreationFail: 無法建立 redflag2
  logRemoteTweakUnavailable: 無法取得遠端調校值
  logSetupCancelled: 設定已取消，Self-hosted LiveSync 正在等候你完成設定！
  msgFetchRemoteAgain: |-
    你可能已經知道，Self-hosted LiveSync 變更了預設行為與資料庫結構。

    值得慶幸的是，在你的努力下，遠端資料庫似乎已經完成遷移。恭喜！

    不過，還需要再多做一點。此裝置的設定與遠端資料庫不相容，我們需要再次從遠端資料庫抓取。現在要再次從遠端抓取嗎？

    ___注意：在變更設定並再次抓取資料庫之前，我們無法進行同步。___
    ___注意 2：chunks 完全不可變，我們只需要抓取中繼資料與差異部分。___
  msgSinceV02321: |-
    自 v0.23.21 起，Self-hosted LiveSync 變更了預設行為與資料庫結構，進行了以下變更：

    1. **檔名的大小寫敏感性**
       現在處理檔名時不區分大小寫。這對多數平台是有益的變更，除了 Linux 與 iOS，它們無法有效處理檔名的大小寫敏感性。
       （在這些平台上，檔名相同但大小寫不同的檔案會顯示警告。）

    2. **chunks 的版本處理**
       chunks 是不可變的，因此可以固定其版本。這項變更會提升檔案儲存的效能。

    ___不過，若要啟用這兩項變更中的任何一項，都需要重建遠端與本機資料庫。這個過程需要幾分鐘，建議在時間充裕時進行。___

    - 如果你想維持先前的行為，可以使用 `${KEEP}` 略過此程序。
    - 如果你目前沒有足夠的時間，請選擇 `${DISMISS}`，之後會再次提示你。
    - 如果你已在其他裝置上重建過資料庫，請選擇 `${DISMISS}` 並再次嘗試同步；由於偵測到差異，系統會再次提示你。
