This will rebuild the local database on this device using the most recent data from the server. This action is designed to resolve synchronisation inconsistencies and restore correct functionality.: 這會使用伺服器上最新的資料，重建此裝置上的本機資料庫。此操作旨在解決同步不一致的問題，並恢復正常功能。
To minimise the creation of new conflicts: 為了盡量減少新增衝突
We recommend that you copy your Vault folder to a safe location. This will provide a safeguard in case a large number of conflicts arise, or if you accidentally synchronise with an incorrect destination.: 我們建議你先將 Vault 資料夾複製到安全的位置。萬一發生大量衝突，或不小心同步到錯誤的目標，這可以作為一層保障。
You should create a new synchronisation destination and rebuild your data there.: 你應該建立一個新的同步目標，並在該處重建你的資料。
You should perform this operation only in exceptional circumstances, such as when the server data is completely corrupted, when changes on all other devices are no longer needed, or when the database size has become unusually large in comparison to the Vault size.: 只有在特殊情況下才應執行此操作，例如伺服器資料已完全損毀、其他所有裝置上的變更都已不再需要，或資料庫大小相對於 Vault 大小已變得異常龐大時。
