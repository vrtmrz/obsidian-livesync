"How should files that were deleted on other devices be handled?\n\n- **${NEWER_CLEANUP}**: Delete local files if they were deleted on remote.\n  This keeps your Vaults consistent. Back up any important local data first.\n- **${NEWER_SYNC_ALL}**: Recreate remote files even if they were deleted on remote.\n  This keeps all local files, but may create duplicates when a file exists locally but not remotely. Remove any duplicates manually after synchronisation.": >-
  他のデバイスで削除されたファイルを、このデバイスでどのように扱いますか？

  - **${NEWER_CLEANUP}**: リモートでも削除されたファイルを、このデバイスからも削除します。
    これにより、各 Vault の内容を揃えられます。重要なローカルデータがある場合は、事前にバックアップしてください。
  - **${NEWER_SYNC_ALL}**: リモートで削除されたファイルを、ローカルのコピーから復元します。
    ローカルのファイルを残せますが、ローカルにだけ存在するファイルが重複する場合があります。同期後に重複を手動で整理してください。
"Since you have chosen to overwrite all local files with remote data, **how would you like to handle local files that are not present in the remote database?**\n\n- **${DELETE_ALL}**: Local-only files and remote-deleted files will be removed.\n  This makes your local Vault match the remote database. Back up any important local data first.\n- **${DELETE_NONE}**: All existing local files will be preserved.\n  This keeps all local files, but may leave duplicates of files that exist only on this device. Remove any duplicates manually after synchronisation.": >-
  リモートのデータですべてのローカルファイルを上書きすることを選択しました。**リモートデータベースにないローカルファイルをどのように扱いますか？**

  - **${DELETE_ALL}**: ローカルにだけあるファイルと、リモートで削除されたファイルを削除します。
    ローカル Vault をリモートデータベースと同じ状態にします。重要なデータがある場合は、事前にバックアップしてください。
  - **${DELETE_NONE}**: 既存のローカルファイルをすべて保持します。
    すべてのローカルファイルを残せますが、このデバイスにだけあるファイルが重複する場合があります。同期後に重複を手動で整理してください。
"We are about to retrieve the remote data.\n\nFirstly, how shall we handle the data retrieved from this remote source?\n\n- **${NEWER_WINS}**: Keep the version with the latest modification time.\n  This may suit you if you already use Self-hosted LiveSync and have made changes on multiple devices. It attempts to merge changes based on modification times.\n- **${REMOTE_WINS}**: Treat the remote data as the source of truth.\n  This may be easiest if you are new to Self-hosted LiveSync. It overwrites all local files with remote data, so back up any important local data first.\n- **${DETAILED}**: Open the detailed setup wizard.\n  Choose this option to review changes before applying them or to have more control over synchronisation.": >-
  リモートサーバーからデータを取得します。

  取得するデータをどのように扱いますか？

  - **${NEWER_WINS}**: 更新日時が新しい方のバージョンを採用します。
    複数のデバイスでファイルを変更している場合に適しています。LiveSync は更新日時に基づいて採用するバージョンを決めます。
  - **${REMOTE_WINS}**: リモートデータを正として扱います。
    Self-hosted LiveSync を初めて使う場合は、この方法が分かりやすいでしょう。ローカルファイルはすべてリモートデータで上書きされるため、重要なデータがある場合は事前にバックアップしてください。
  - **${DETAILED}**: 詳細セットアップウィザードを開きます。
    変更を適用する前に確認したい場合や、同期を細かく制御したい場合に選択してください。

"How should files that were deleted on other devices be handled?\n\n- **${NEWER_CLEANUP}**: Delete local files if they were deleted on remote.\n  This is useful if you want to keep your vault clean and consistent across devices, but please make sure you have a backup if there is already any important data in your vault.\n- **${NEWER_SYNC_ALL}**: Recreate remote files even if they were deleted on remote.\n  This option will keep all your local files, but it may cause duplicates if there are files that exist on local but not on remote. You can clean up these duplicates manually after the synchronisation.": >-
  他のデバイスで削除されたファイルを、このデバイスでどのように扱いますか？

  - **${NEWER_CLEANUP}**: リモートでも削除されたファイルを、このデバイスからも削除します。
    これにより、各 Vault の内容を揃えられます。重要なローカルデータがある場合は、事前にバックアップしてください。
  - **${NEWER_SYNC_ALL}**: リモートで削除されたファイルを、ローカルのコピーから復元します。
    ローカルのファイルを残せますが、ローカルにだけ存在するファイルが重複する場合があります。同期後に重複を手動で整理してください。
"Since you have chosen to overwrite all local files with remote data, **how would you like to handle local files that are not present in the remote database?**\n\n- **${DELETE_ALL}**: Local-only files and remote-deleted files will be removed.\n  This option will make your local vault exactly the same as the remote database, but please make sure you have a backup if there is any important data in your vault.\n- **${DELETE_NONE}**: All existing local files will be preserved.\n  This option will keep all your local files, but it may cause duplicates if there are files that exist on local but not on remote. You can clean up these duplicates manually after the synchronisation.": >-
  リモートのデータですべてのローカルファイルを上書きすることを選択しました。**リモートデータベースにないローカルファイルをどのように扱いますか？**

  - **${DELETE_ALL}**: ローカルにだけあるファイルと、リモートで削除されたファイルを削除します。
    ローカル Vault をリモートデータベースと同じ状態にします。重要なデータがある場合は、事前にバックアップしてください。
  - **${DELETE_NONE}**: 既存のローカルファイルをすべて保持します。
    すべてのローカルファイルを残せますが、このデバイスにだけあるファイルが重複する場合があります。同期後に重複を手動で整理してください。
"We are about to retrieve the remote data.\n\nFirstly, how shall we handle the data retrieved from this remote source?\n\n- **${NEWER_WINS}**: Compares the modified time of files and takes the newer one.\n  If you have been using Self-hosted LiveSync and have made changes on multiple devices, this option may be suitable for you as it tries to merge changes based on modified time.\n- **${REMOTE_WINS}**: Remote data is the source of truth.\n  If you are new to using Self-hosted LiveSync. This option may be easiest to understand and get started with.\n  It will overwrite all your local files with the remote data, so please make sure you have a backup if there is any important data in your vault.\n- **${DETAILED}**: Opens the detailed setup wizard.\n  If you want to have more control over the synchronisation process, or want to review the changes before applying, you can choose this option to use the detailed flow.": >-
  リモートサーバーからデータを取得します。
  取得するデータをどのように扱いますか？

  - **${NEWER_WINS}**: 更新日時が新しい方のバージョンを採用します。
    複数のデバイスでファイルを変更している場合に適しています。LiveSync は更新日時に基づいて採用するバージョンを決めます。
  - **${REMOTE_WINS}**: リモートデータを正として扱います。
    Self-hosted LiveSync を初めて使う場合は、この方法が分かりやすいでしょう。ローカルファイルはすべてリモートデータで上書きされるため、重要なデータがある場合は事前にバックアップしてください。
  - **${DETAILED}**: 詳細セットアップウィザードを開きます。
    変更を適用する前に確認したい場合や、同期を細かく制御したい場合に選択してください。
