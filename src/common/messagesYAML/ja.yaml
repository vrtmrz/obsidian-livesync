    ButtonProceed: 設定をテストして続行
    ErrorFailedToParse: セットアップ URIを解析できませんでした。URIとパスフレーズを確認してください。
    ErrorPassphraseRequired: Vault のパスフレーズを入力してください。
    GuidanceLine1: サーバーのセットアップ時または別のデバイスで生成されたセットアップ URIと、Vault のパスフレーズを入力してください。
    GuidanceLine2: コマンドパレットで「Copy settings as a new setup URI」を実行すると、新しいセットアップ URIを生成できます。
    InvalidInfo: セットアップ URIが無効です。内容を確認して再試行してください。
    LabelPassphrase: Vault のパスフレーズ
    LabelSetupURI: セットアップ URI
    PlaceholderPassphrase: Vault のパスフレーズを入力してください
