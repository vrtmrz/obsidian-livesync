If enabled, changes will be automatically broadcasted to all connected peers. Notified peers will start fetching the changes.: 有効にすると、接続されているすべてのピアに変更が自動的にブロードキャストされます。通知を受け取ったピアは変更の取得を開始します。
If enabled, chunks will be split into no more than 100 items. However, dedupe is slightly weaker.: 有効にすると、チャンクは最大100個ずつのまとまりに分割されます。ただし、重複排除の効果はわずかに低下します。
If enabled, efficient per-file customization sync will be used. A minor migration is required when enabling this feature, and all devices must be updated to v0.23.18. Enabling this feature will result in losing compatibility with older versions.:
