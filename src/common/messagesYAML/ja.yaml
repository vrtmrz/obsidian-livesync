    AlgorithmWarning: 暗号化アルゴリズムを変更すると、別のアルゴリズムで暗号化された既存データにはアクセスできなくなります。すべてのデバイスで同じアルゴリズムを使うよう設定し、データにアクセスできる状態を維持してください。
    ButtonCancel: キャンセル
    ButtonProceed: 進む
    DefaultAlgorithmDesc: ほとんどの場合は、既定のアルゴリズム（${algorithm}）をそのまま使用してください。この設定が必要になるのは、既存の
      Vault が別の形式で暗号化されている場合のみです。
    Guidance: エンドツーエンド暗号化の設定を行ってください。
    LabelEncrypt: エンドツーエンド暗号化
    LabelEncryptionAlgorithm: 暗号化アルゴリズム
    LabelObfuscateProperties: プロパティを難読化
    MultiDestinationWarning: 複数の同期先へ接続する場合でも、この設定は同一である必要があります。
    ObfuscatePropertiesDesc: プロパティ（ファイルパス、サイズ、作成日時、更新日時など）を難読化すると、リモートサーバー上のファイルやフォルダーの構造や名前を特定しにくくできるため、追加の保護層になります。これによりプライバシーが守られ、権限のない第三者がデータに関する情報を推測しにくくなります。
    PassphraseValidationLine1: エンドツーエンド暗号化のパスフレーズは、実際に同期処理が開始されるまで検証されない点にご注意ください。これはデータを保護するためのセキュリティ対策です。
    PassphraseValidationLine2: サーバー情報を手動で設定する際は細心の注意を払ってください。同期が開始されるまでパスフレーズを検証できないため、誤ったパスフレーズを入力するとサーバー上のデータが破損するおそれがあります。
    PlaceholderPassphrase: パスフレーズを入力してください
    StronglyRecommendedLine1: エンドツーエンド暗号化を有効にすると、データはリモートサーバーへ送信される前にこのデバイス上で暗号化されます。つまり、たとえ誰かがサーバーへアクセスできても、パスフレーズがなければデータを読むことはできません。他のデバイスでデータを復号する際にも必要になるため、パスフレーズは必ず覚えておいてください。
    StronglyRecommendedLine2: また、ピアツーピア（P2P）同期を使用している場合でも、将来ほかの方式へ切り替えてリモートサーバーへ接続するときには、この設定が使われます。
    StronglyRecommendedTitle: 強く推奨
    Title: エンドツーエンド暗号化
  ScanQRCode:
    ButtonClose: このダイアログを閉じる
    Guidance: 既存のデバイスから設定を取り込むには、以下の手順に従ってください。
    Step1: このデバイスでは、この Vault を開いたままにしてください。
    Step2: 元のデバイスで Obsidian を開きます。
    Step3: 元のデバイスでコマンドパレットから「Show settings as a QR code」を実行します。
    Step4: このデバイスでカメラアプリに切り替えるか QR コードスキャナーを使って、表示された QR コードを読み取ってください。
    Title: QR コードをスキャン
  ShowQRCode:
