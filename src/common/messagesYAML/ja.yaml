Should we keep folders that don't have any files inside?: 中にファイルがないフォルダーを保持しますか？
Should we only check for conflicts when a file is opened?: ファイルを開いたときのみ競合をチェックしますか？
Should we prompt you about conflicting files when a file is opened?: ファイルを開いたときに競合ファイルについて確認を求めますか？
Should we prompt you for every single merge, even if we can safely merge automatcially?: 自動的に安全にマージできる場合でも、すべてのマージについて確認を求めますか？
Show full banner: 完全なバナーを表示
Show history: 履歴を表示
Show icon only: アイコンのみ表示
Show only notifications: 通知のみ表示
Show password: パスワードを表示
Show status as icons only: ステータス表示をアイコンのみにする
Show status icon instead of file warnings banner: ファイル警告バナーの代わりにステータスアイコンを表示
Show status inside the editor: ステータスをエディタ内に表示
Show status on the status bar: ステータスバーに、ステータスを表示
Show verbose log. Please enable if you report an issue.: 詳細なログを表示します。Issue を報告する際は有効にしてください。
Signaling Server Connection: シグナリングサーバー接続
Signalling Relays: シグナリングリレー
Signalling Status: シグナリングステータス
Skip and close: スキップして閉じる
Snippets: スニペット
"Some devices have differing progress values (max: ${maxProgress}, min: ${minProgress}).\nThis may indicate that some devices have not completed synchronisation, which could lead to conflicts. Strongly recommend confirming that all devices are synchronised before proceeding.": |-
  一部のデバイスで進捗値が異なっています（最大: ${maxProgress}、最小: ${minProgress}）。
  一部のデバイスで同期が完了していない可能性があり、競合の原因になることがあります。続行する前に、すべてのデバイスが同期済みであることを確認することを強くおすすめします。
Some files failed to synchronise. What would you like to do?: 一部のファイルの同期に失敗しました。どうしますか？
Start Broadcasting: ブロードキャストを開始
Start change-broadcasting on Connect: 接続時に変更のブロードキャストを開始する
Start Sync & Close: 同期を開始して閉じる
Starts synchronisation when a file is saved.: ファイルが保存されたときに同期を開始します。
Stat: 状態
Stats: 統計
Stop ⚡: 停止 ⚡
Stop Broadcasting: ブロードキャストを停止
Stop reflecting database changes to storage files.: データベースの変更をストレージファイルに反映させない
Stop watching for file changes.: 監視の停止
Storage -> Database: ストレージ → データベース
Strongly Recommended: 強く推奨
Subject (whoami): サブジェクト（whoami）
Suppress notification of hidden files change: 非表示ファイルの変更通知を抑制
Suspend database reflecting: データベース反映の一時停止
Suspend file watching: 監視の一時停止
Switch to IDB: IDB に切り替える
Switch to IndexedDB: IndexedDB に切り替える
Strict content check on startup: 起動時にコンテンツを厳密に確認
Compare file contents even when modification time and size match. This can slow startup in large vaults.: 更新日時とサイズが同じ場合でもファイルの内容を比較します。大きなVaultでは起動が遅くなることがあります。
Sync: 同期
Sync after merging file: ファイルがマージ（統合）された時に同期
Sync automatically after merging files: ファイルのマージ後に自動的に同期
Sync Mode: 同期モード
Sync on Editor Save: エディタでの保存時に、同期されます
Sync on File Open: ファイルを開いた時に同期
Sync on Save: 保存時に同期
Sync on Startup: 起動時同期
Sync once: 1回同期
Synchronisation Issues Detected: 同期の問題が検出されました
Synchronisation utilising journal files. You must have set up an S3/MinIO/R2 compatible object storage.: ジャーナルファイルを利用する同期方式です。S3/MinIO/R2 互換のオブジェクトストレージを事前に構成しておく必要があります。
Synchronising files: 同期するファイル
Syncing: 同期中
"Syncing...": 同期中...
Target patterns: 対象パターン
Test connection and save: 接続をテストして保存
Test Settings and Continue: 設定をテストして続行
Testing only - Resolve file conflicts by syncing newer copies of the file, this can overwrite modified files. Be Warned.: テスト用 - ファイルの新しいコピーを同期してファイル競合を解決します。これにより変更されたファイルが上書きされる可能性があります。注意してください。
The algorithm used for JWT authentication.: JWT 認証に使用されるアルゴリズム。
The Application ID for P2P connection. This should be same among your devices. Default is 'self-hosted-livesync' and could not be modified from the UI.:
  P2P 接続用のアプリケーション ID。所有するデバイス間で同じ値にする必要があります。デフォルトは「self-hosted-livesync」で、UI
  からは変更できません。
The connection test cannot add a signalling relay while P2P is active. Use the active relay settings, or disconnect P2P before testing.: P2Pがアクティブな間は、接続テストでシグナリングリレーを追加できません。現在有効なリレー設定を使用するか、テスト前にP2Pを切断してください。
The connection to the server has been configured successfully. As the next step,: サーバーへの接続設定が正常に完了しました。次のステップとして、
The credential/password for the TURN servers.: TURN サーバーの認証情報/パスワード。
The delay for consecutive on-demand fetches: 連続するオンデマンド取得の間隔
The files in this Vault are almost identical to the server's.: このVault内のファイルはサーバー上のファイルとほぼ同一です。
"The following accepted nodes are missing its node information:\n- ${missingNodes}\n\nThis indicates that they have not been connected for some time or have been left on an older version.\nIt is preferable to update all devices if possible. If you have any devices that are no longer in use, you can clear all accepted nodes by locking the remote once.": |-
  次の承認済みノードにはノード情報がありません:
  - ${missingNodes}

  これらのノードはしばらく接続されていないか、古いバージョンのままになっている可能性があります。
  可能であれば、まずすべてのデバイスを更新することをおすすめします。すでに使用していないデバイスがある場合は、リモートを一度ロックすることで承認済みノードをすべてクリアできます。
The Group ID and passphrase are used to identify your group of devices. Make sure to use the same Group ID and passphrase on all devices you want to synchronise.: グループIDとパスフレーズは、デバイスのグループを識別するために使用されます。同期したいすべてのデバイスで同じグループIDとパスフレーズを使用してください。
The Hash algorithm for chunk IDs: チャンクIDのハッシュアルゴリズム
The IndexedDB adapter often offers superior performance in certain scenarios, but it has been found to cause memory leaks when used with LiveSync mode. When using LiveSync mode, please use IDB adapter instead.:
  IndexedDB アダプターは特定のシナリオで優れたパフォーマンスを発揮することが多いですが、LiveSync モードと併用するとメモリリークを引き起こすことが確認されています。LiveSync モードを使用する場合は、代わりに IDB アダプターを使用してください。
The key (PSK in HSxxx in base64, or private key in ESxxx in PEM) used for JWT authentication.: JWT 認証に使用するキー（HSxxx の場合は Base64 形式の PSK、ESxxx の場合は PEM 形式の秘密鍵）。
The key ID. this should be matched with CouchDB->jwt_keys->ALG:_`kid`.: キー ID。CouchDB の jwt_keys -> ALG:_`kid` と一致している必要があります。
the latest synchronisation data will be downloaded from the server to this device.: 最新の同期データがサーバーからこのデバイスへダウンロードされます。
the local database, that is to say the synchronisation information, must be reconstituted.: ローカルデータベース（すなわち同期情報）を再構築する必要があります。
The maximum duration for which chunks can be incubated within the document. Chunks exceeding this period will graduate to independent chunks.: ドキュメント内でチャンクを保持できる最大期間。この期間を超えたチャンクは独立したチャンクに昇格します。
The maximum number of chunks that can be incubated within the document. Chunks exceeding this number will immediately graduate to independent chunks.: ドキュメント内で保持できるチャンクの最大数。この数を超えたチャンクは即座に独立したチャンクに昇格します。
The maximum total size of chunks that can be incubated within the document. Chunks exceeding this size will immediately graduate to independent chunks.: ドキュメント内で保持できるチャンクの最大合計サイズ。このサイズを超えたチャンクは即座に独立したチャンクに昇格します。
The minimum interval for automatic synchronisation on event.: イベント発生時の自動同期の最小間隔です。
The Nostr relay servers to establish connections for P2P connections. Multiple servers can be separated by commas.: P2P 接続を確立するための Nostr リレーサーバー。複数のサーバーを指定する場合はカンマで区切ります。
The Passphrase for P2P connection. This should be same among your devices.: P2P 接続用のパスフレーズ。所有するデバイス間で同じ値にする必要があります。
The remote database is locked for synchronisation to prevent vault corruption because this device is not marked as 'resolved'. Please back up your vault, reset the local database, and select 'Mark this device as resolved'. This warning will persist until replication confirms the device is resolved.:
  このデバイスが「解決済み」としてマークされていないため、Vault の破損を防ぐ目的でリモートデータベースの同期がロックされています。Vault
  のバックアップを作成し、ローカルデータベースをリセットした上で、「このデバイスを解決済みとしてマーク」を選択してください。この警告は、レプリケーションによってデバイスの解決が確認されるまで表示され続けます。
The remote is already set up, and the configuration is compatible (or got compatible by this operation).: リモートはすでに設定されており、設定に互換性があります（またはこの操作によって互換性が確保されました）。
The Room ID for P2P connection. This should be same among your devices.: P2P 接続用のルーム ID。所有するデバイス間で同じ値にする必要があります。
The Rotation duration of token in minutes. Each generated tokens will be valid only within this duration.: トークンのローテーション期間（分単位）。生成された各トークンはこの期間内でのみ有効です。
The Setup-URI does not appear to be valid. Please check that you have copied it correctly.: Setup-URIが有効ではないようです。正しくコピーされているか確認してください。
The Setup-URI is valid and ready to use.: Setup-URIは有効で使用可能です。
the single, authoritative master copy: 唯一の正統なマスターコピー
The subject for JWT authentication. Mostly username.: JWT 認証のサブジェクト。通常はユーザー名です。
the synchronisation data on the server will be built based on the current data on this device.: サーバー上の同期データはこのデバイスの現在のデータに基づいて構築されます。
The TURN servers to use for P2P connections. Multiple servers can be separated by commas.: P2P 接続に使用する TURN サーバー。複数のサーバーを指定する場合はカンマで区切ります。
The username for the TURN servers.: TURN サーバーのユーザー名。
Themes: テーマ
There is a way to resolve this on other devices.: 他のデバイスでこれを解決する方法があります。
There may be differences between the files in this Vault and the server.: このVault内のファイルとサーバー上のファイルとの間に差異がある可能性があります。
Therefore, we ask that you exercise extreme caution when configuring server information manually. If an incorrect passphrase is entered, the data on the server will become corrupted.: サーバー情報を手動で設定する際は細心の注意を払ってください。同期が開始されるまでパスフレーズを検証できないため、誤ったパスフレーズを入力するとサーバー上のデータが破損するおそれがあります。
This can isolate your connections between devices. Use the same Room ID for the same devices.: これによりデバイス間の接続を分離できます。同一のデバイス群には同じルームIDを使用してください。
This device: このデバイス
This device name: このデバイスの名前
This feature enables direct synchronisation between devices. No server is required, but both devices must be online at the same time for synchronisation to occur, and some features may be limited. Internet connection is only required to signalling (detecting peers) and not for data transfer.:
  この機能ではデバイス同士を直接同期できます。サーバーは不要ですが、同期を行うには両デバイスが同時にオンラインである必要があり、一部機能は制限されます。インターネット接続はシグナリング（ピア検出）にのみ必要で、データ転送自体には使われません。
This first setup has several short steps because it confirms encryption, the connection method, and which device provides the initial data. Once it is complete, additional devices can reuse a Setup URI.:
  最初のセットアップは、暗号化、接続方法、およびどのデバイスが初期データを提供するかを確認するため、いくつかの短いステップで構成されています。完了すると、追加のデバイスでセットアップ URIを再利用できるようになります。
This is an advanced option for users who do not have a URI or who wish to configure detailed settings.: URI を持っていない場合や、詳細設定を手動で行いたいユーザー向けの上級者オプションです。
This is an extremely powerful operation. We strongly recommend that you copy your Vault folder to a safe location.: これは影響の非常に大きい操作です。Vaultフォルダーを安全な場所にコピーすることを強く推奨します。
This is the most suitable synchronisation method for the design. All functions are available. You must have set up a CouchDB instance.: この設計に最も適した同期方式です。すべての機能が利用できます。CouchDB インスタンスを事前に構成しておく必要があります。
This optional check uses Obsidian's internal request API and sends the credentials above to the CouchDB server. Use it only with a server you trust; administrator access may be required.:
  このオプションのチェックはObsidianの内部Request
  APIを使用し、上記の認証情報をCouchDBサーバーに送信します。信頼できるサーバーでのみ使用してください。管理者権限が必要になる場合があります。
This passphrase will not be copied to another device. It will be set to `Default` until you configure it again.: このパスフレーズは他のデバイスにコピーされません。再度設定するまで `Default` のままになります。
This password is used to encrypt the connection. Use something long enough.: このパスワードは接続の暗号化に使用されます。十分な長さのパスワードを使用してください。
This procedure will first delete all existing synchronisation data from the server. Following this, the server data will be completely rebuilt, using the current state of your Vault on this device (including its local database) as:
  "この手順では、まずサーバー上の既存の同期データをすべて削除します。その後、このデバイス上のVaultの現在の状態（ローカルデータベースを含む）を基に、サーバーデータを完全に再構築します。このVaultの位置づけ:"
This setting must be the same even when connecting to multiple synchronisation destinations.: 複数の同期先に接続する場合でも、この設定は同一である必要があります。
This Vault is empty, or contains only new files that are not on the server.: このVaultは空であるか、サーバー上に存在しない新しいファイルのみが含まれています。
This will rebuild the local database on this device using the most recent data from the server. This action is designed to resolve synchronisation inconsistencies and restore correct functionality.:
  これにより、サーバーの最新データを使用してこのデバイスのローカルデータベースが再構築されます。この操作は同期の不整合を解消し、正常な機能を復元することを目的としています。
This will recreate chunks for all files. If there were missing chunks, this may fix the errors.: すべてのファイルのチャンクを再作成します。欠損しているチャンクがあった場合、エラーが解消される可能性があります。
To minimise the creation of new conflicts: 新たな競合の発生を最小限に抑えるため
To prevent unwanted vault corruption, the remote database has been locked for synchronisation. (This device is marked as 'resolved'.) When all your devices are marked as 'resolved', unlock the database. This warning will continue to appear until replication confirms the device is resolved.:
  意図しない Vault
  の破損を防ぐため、リモートデータベースの同期がロックされています。（このデバイスは「解決済み」としてマークされています。）すべてのデバイスが「解決済み」になったら、データベースのロックを解除してください。この警告は、レプリケーションによってデバイスの解決が確認されるまで表示され続けます。
Transfer Tweak: 転送の調整項目
TURN Credential: TURN認証情報
TURN server settings are only necessary if you are behind a strict NAT or firewall that prevents direct P2P connections. In most cases, you can leave these fields blank.:
  TURNサーバー設定は、直接のP2P接続を妨げる厳格なNATやファイアウォールの内側にある場合にのみ必要です。ほとんどの場合、これらのフィールドは空白のままで問題ありません。
TURN Server URLs (comma-separated): TURNサーバーURL（カンマ区切り）
TURN Servers: TURN サーバー
TURN Username: TURNユーザー名
TweakMismatchResolve:
  Action:
    DisableAutoAcceptCompatible: 自動受け入れを無効化
    Dismiss: 無視
    EnableAutoAcceptCompatible: 自動受け入れを有効化
    UseConfigured: 設定済みの設定を使用
    UseMine: リモートデータベースの設定を更新
    UseMineAcceptIncompatible: リモートデータベースの設定を更新するがそのまま維持
    UseMineWithRebuild: リモートデータベースの設定を更新して再構築
    UseRemote: このデバイスに設定を適用
    UseRemoteAcceptIncompatible: このデバイスに設定を適用し、非互換性を無視
    UseRemoteWithRebuild: このデバイスに設定を適用し、再取得
  Message:
    AutoAcceptCompatibleUndefined: |-

      デバイス間で設定が異なっています。互換性のある変更を自動的に適用できます。
      この「自動受け入れ」設定を有効にしますか？
    Main: |-

      リモートデータベースの設定は以下の通りです。これらの値は、このデバイスと少なくとも1回同期された他のデバイスによって設定されています。

      これらの設定を使用する場合は、%{TweakMismatchResolve.Action.UseConfigured}を選択してください。
      このデバイスの設定を維持する場合は、%{TweakMismatchResolve.Action.Dismiss}を選択してください。

      ${table}

      >[!TIP]
      > すべての設定を同期したい場合は、この機能で最小限の設定を適用した後、`Sync settings via markdown`を使用してください。

      ${additionalMessage}
    MainTweakResolving: |-
      このデバイスの設定がリモートサーバーの設定と一致していません。以下の差異を確認し、解決方法を選択してください:

