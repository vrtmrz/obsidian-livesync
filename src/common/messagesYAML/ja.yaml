    > [!MORE]-
    > Vault を長年使用している場合、参照されていないチャンクがデータベース内に蓄積している可能性があります。データベースを再構築することで、この未使用データを削除してサイズを大幅に削減できる可能性があります。
    >
    > 単純に Vault の容量自体が増加している場合は、データベースを再構築する前にファイルを整理してください。削除処理を高速に保つため、Self-hosted LiveSync は削除されたデータを即座には消去しません。詳細は[技術ドキュメント](https://github.com/vrtmrz/obsidian-livesync/blob/main/docs/tech_info.md)を参照してください。
    >
    > 容量の増加に問題がなければ、通知制限を 100 MB 単位で引き上げられます。自前でサーバーを運用している場合に適していますが、定期的な再構築をおすすめします。
    >

    > [!WARNING]
    > すべてを再構築する前に、すべてのデバイスが同期されていることを確認してください。プラグインは可能な限り変更内容をマージします。
