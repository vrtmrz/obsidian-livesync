      再実行したい場合は、Hatch から実行できます。
    messageUnrecoverable: |
      **このデバイスで修復できないファイル:**

      ${filesNotRecoverable}

      これらのファイルはメタデータに不整合があり、このデバイスでは修復できません（ほとんどの場合、どちらが正しいか判定できません）。
      復元するには、他のデバイスでもこの機能で確認するか、バックアップから手動で復元してください。
    title: 破損ファイルが検出されました
  insecureChunkExist:
    buttons:
      fetch: リモートは再構築済みです。リモートから取得します。
      later: 後で行う
      rebuild: すべてを再構築
    laterMessage: できるだけ早く対処することを強く推奨します。
    message: |
      一部のチャンクが安全に保存されておらず、データベースで暗号化されていません。
      **この問題を修正するにはデータベースを再構築してください**。

      リモートデータベースがSSLで設定されていない、または安全性の低い認証情報を使用している場合、**機密データが漏洩するリスクがあります**。

      注意: すべてのデバイスでSelf-hosted LiveSync v0.25.6以降にアップグレードし、必ずVaultをバックアップしてください。
      注意2: 「すべてを再構築」と「取得」には時間と通信量がかかります。オフピーク時間に安定したネットワーク環境で実行してください。
    title: 安全でないチャンクが見つかりました！
  logBulkSendCorrupted: チャンクの一括送信が有効になっていましたが、この機能に問題が発生したため、自動的に無効化されました。
  logFetchRemoteTweakFailed: リモートの調整値の取得に失敗しました
  logLocalDatabaseNotReady: 何か問題が発生しました！ローカルデータベースが準備できていません
  logMigratedSameBehaviour: 以前と同じ動作でdb:${current}に移行しました
  logMigrationFailed: ${old}から${current}への移行が失敗またはキャンセルされました
  logRedflag2CreationFail: redflag2の作成に失敗しました
  logRemoteTweakUnavailable: リモートの調整値を取得できませんでした
  logSetupCancelled: セットアップがキャンセルされました。Self-hosted LiveSync の設定を完了してください。
  msgFetchRemoteAgain: |-
    Self-hosted LiveSync のデフォルトの動作とデータベース構造が変更されました。リモートデータベースは正常に移行されたようです。

    しかし、このデバイスの設定はリモートデータベースと互換性がないため、リモートデータベースを再度取得（Fetch）する必要があります。今すぐ取得しますか？

    ___注意: 設定を更新してデータベースを再取得するまで同期できません。___
    ___注意2: チャンクは不変であるため、メタデータと変更されたデータのみが取得されます。___
  msgSinceV02321: |-
    v0.23.21 以降、Self-hosted LiveSync のデフォルトの動作とデータベース構造が変更されました。変更点は以下のとおりです：

    1. **ファイル名の大文字小文字を区別しない処理**
       ファイル名は大文字小文字を区別せずに処理されるようになりました。Linux および iOS では大文字小文字のみが異なるファイルが個別に扱われる場合があり、該当するファイル名が検出されると警告が表示されます。

    2. **チャンクのリビジョン処理**
       チャンクは不変であるため、リビジョンを固定できます。これによりファイル保存のパフォーマンスが向上します。

    ___いずれの変更を適用する場合でも、ローカルとリモートの両方のデータベースを再構築する必要があります。処理には数分かかるため、時間に余裕があるときに実行してください。___

    - 以前の動作を維持したい場合は、`${KEEP}` を使用してこの処理をスキップできます。
    - 時間がない場合は `${DISMISS}` を選択してください。後で再度確認が表示されます。
    - 別のデバイスでデータベースを再構築した場合は、`${DISMISS}` を選択して再度同期を試してください。差異が検出された場合は、再度確認が表示されます。
  optionAdjustRemote: リモートに合わせる
