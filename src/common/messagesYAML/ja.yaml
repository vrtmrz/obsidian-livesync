  optionEnableFixedRevisionForChunks: "#2のみ有効にする"
  optionKeepPreviousBehaviour: 以前の動作を維持
  optionNoAskAgain: いいえ、後で確認する
  optionYesFetchAgain: はい、再取得する
  titleCaseSensitivity: 大文字小文字の区別
