      REASON: エンドツーエンド暗号化の安全性と速度が向上しました。また、コードレビューで従来のE2EEに脆弱性が見つかりました。できるだけ早く新しい方式に切り替えることをおすすめします。この変更によりご不便をおかけしますが、古いバージョンとの互換性はありません。すべての同期デバイスを v0.25.0 以降にアップデートしてください。データベースの再構築は必須ではありません。以後のデータ転送時に新しい形式へ変換されますが、可能であれば再構築をおすすめします。
