  v0.23.18 以降にアップデートしてください。有効にすると、古いバージョンとの互換性が失われます。
If enabled, newly created chunks are temporarily kept within the document, and graduated to become independent chunks once stabilised.: 有効にすると、新しく作成されたチャンクはドキュメント内に一時的に保持され、安定したら独立したチャンクになります。
If enabled, the ⛔ icon will be shown inside the status instead of the file warnings banner. No details will be shown.: 有効にすると、ファイル警告バナーの代わりにステータス内へ ⛔ アイコンのみを表示します。詳細は表示されません。
If enabled, the file properties will be encrypted in the remote database. This is useful for protecting sensitive information in file paths, sizes, and IDs of its chunks. If you are using V1 E2EE, this only obfuscates the file path.:
  有効にすると、リモートデータベース内のファイルプロパティが暗号化されます。これはファイルパス、サイズ、チャンク ID
  などの機密情報を保護するのに役立ちます。V1 E2EE を使用している場合は、ファイルパスの難読化のみが行われます。
If enabled, the file under 1kb will be processed in the UI thread.: 有効にすると、1kb未満のファイルはUIスレッドで処理されます。
If enabled, the forcePathStyle option will be used for bucket operations.: 有効にすると、バケット操作に forcePathStyle オプションが使用されます。
If enabled, the notification of hidden files change will be suppressed.: 有効にすると、非表示ファイルの変更通知が抑制されます。
If enabled, the P2P connection will be automatically started when the application launches.: 有効にすると、アプリケーションの起動時に P2P 接続が自動的に開始されます。
If enabled, the plugin will not attempt to connect to the remote database even if the chunk was not found locally.: 有効にすると、チャンクがローカルで見つからない場合でも、プラグインはリモートデータベースへの接続を試行しません。
If enabled, the request API will be used to avoid `inevitable` CORS problems. This is a workaround and may not work in all cases. PLEASE READ THE DOCUMENTATION BEFORE USING THIS OPTION. This is a less-secure option.:
  有効にすると、Request API を使用して避けられない CORS
  問題を回避します。これは回避策であり、すべてのケースで機能するとは限りません。このオプションを使用する前に必ずドキュメントをお読みください。セキュリティが低下するオプションです。
If this enabled, all chunks will be stored with the revision made from its content. (Previous behaviour): 有効にすると、すべてのチャンクはコンテンツから作成されたリビジョンと共に保存されます（以前の動作）。
If this enabled, All files are handled as case-Sensitive (Previous behaviour).: 有効にすると、すべてのファイルは大文字小文字を区別して処理されます（以前の動作）。
If this enabled, chunks will be split into semantically meaningful segments. Not all platforms support this feature.: 有効にすると、チャンクは意味のあるセグメント（段落や見出し単位など）に分割されます。一部のプラットフォームではサポートされていません。
If this enabled, JWT will be used for authentication.: 有効にすると、認証に JWT が使用されます。
If this is set, changes to local files which are matched by the ignore files will be skipped. Remote changes are determined using local ignore files.: これを設定すると、除外ファイルに一致するローカルファイルの変更はスキップされます。リモートの変更はローカルの除外ファイルを使用して判定されます。
If this option is enabled, PouchDB will hold the connection open for 60 seconds, and if no change arrives in that time, close and reopen the socket, instead of holding it open indefinitely. Useful when a proxy limits request duration but can increase resource usage.:
  このオプションを有効にすると、PouchDB は接続を60秒間保持し、その間に変更が届かなければ接続を閉じて再接続します。接続を無期限に保持する代わりにこの動作を行います。プロキシがリクエストの持続時間を制限している場合に有用ですが、リソース使用量が増加する可能性があります。
If you cannot avoid CORS issues, you might want to try this option. It uses Obsidian's internal API to communicate with the CouchDB server. Not compliant with web standards, but works. Note that this might break in future Obsidian versions.:
  どうしてもCORSの問題を回避できない場合は、このオプションをお試しください。Obsidianの内部APIを使用してCouchDBサーバーと通信します。Web標準には準拠していませんが動作します。将来のObsidianのアップデートによって動作しなくなる可能性があることにご注意ください。
If you cannot avoid CORS issues, you might want to try this option. It uses Obsidian's internal API to communicate with the S3 server. Not compliant with web standards, but works. Note that this might break in future Obsidian versions.:
  どうしてもCORSの問題を回避できない場合は、このオプションをお試しください。Obsidianの内部APIを使用してS3サーバーと通信します。Web標準には準拠していませんが動作します。将来のObsidianのアップデートによって動作しなくなる可能性があることにご注意ください。
If you have unsynchronised changes in your Vault on this device, they will likely diverge from the server's versions after the reset. This may result in a large number of file conflicts.:
  このデバイスのVaultに未同期の変更がある場合、リセット後にサーバーのバージョンと乖離する可能性が高くなります。これにより、大量のファイル競合が発生する場合があります。
If you reached the payload size limit when using IBM Cloudant, please decrease batch size and batch limit to a lower value.: IBM Cloudant の使用中にペイロードサイズ制限に達した場合は、バッチサイズとバッチ上限をより小さい値に減らしてください。
If you understand the risks and still wish to proceed, select so.: リスクを理解した上で続行を希望する場合は、選択してください。
If you want to store the data in a specific folder within the bucket, you can specify a folder prefix here. Otherwise, leave it blank to store data at the root of the bucket.: バケット内の特定のフォルダーにデータを保存したい場合は、ここにフォルダープレフィックスを指定できます。バケットのルートに保存する場合は空欄のままにしてください。
If you want to use `LiveSync`, you should broadcast changes. All `watching` peers which detects this will start the replication for fetching.:
