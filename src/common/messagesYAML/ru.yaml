Themes: Темы
There is a way to resolve this on other devices.: На других устройствах это можно решить.
There may be differences between the files in this Vault and the server.: Файлы в этом хранилище могут отличаться от файлов на сервере.
Therefore, we ask that you exercise extreme caution when configuring server information manually. If an incorrect passphrase is entered, the data on the server will become corrupted.:
  Поэтому вводите данные сервера вручную очень внимательно. Если ввести неверную
  парольную фразу, данные на сервере испортятся.
This can isolate your connections between devices. Use the same Room ID for the same devices.:
  Так можно разделить подключения между устройствами. Для одних и тех же
  устройств задайте одинаковый ID комнаты.
This device: Это устройство
This device name: Имя этого устройства
This feature enables direct synchronisation between devices. No server is required, but both devices must be online at the same time for synchronisation to occur, and some features may be limited. Internet connection is only required to signalling (detecting peers) and not for data transfer.:
  Эта функция обеспечивает прямую синхронизацию между устройствами. Сервер не
  требуется, но для синхронизации оба устройства должны быть одновременно в
  сети, а некоторые функции могут быть ограничены. Подключение к Интернету нужно
  только для сигнализации (обнаружения пиров), а не для передачи данных.
This first setup has several short steps because it confirms encryption, the connection method, and which device provides the initial data. Once it is complete, additional devices can reuse a Setup URI.:
  "Первая настройка идёт в несколько коротких шагов: надо подтвердить
  шифрование, способ подключения и то, какое устройство даёт первые данные.
  После этого другие устройства можно настроить через Setup URI."
This is an advanced option for users who do not have a URI or who wish to configure detailed settings.:
  Это расширенный вариант для пользователей, у которых нет URI или которые хотят
  вручную задать подробные параметры.
This is an extremely powerful operation. We strongly recommend that you copy your Vault folder to a safe location.:
  Это очень мощная операция. Настоятельно рекомендуем скопировать папку
  хранилища в безопасное место.
This is the most suitable synchronisation method for the design. All functions are available. You must have set up a CouchDB instance.:
  Это наиболее подходящий для данной архитектуры способ синхронизации. Доступны
  все функции. Необходимо заранее развернуть экземпляр CouchDB.
This optional check uses Obsidian's internal request API and sends the credentials above to the CouchDB server. Use it only with a server you trust; administrator access may be required.:
  Эта необязательная проверка использует внутренний API запросов Obsidian и
  отправляет указанные выше учётные данные на сервер CouchDB. Пользуйтесь ей
  только с доверенным сервером; могут понадобиться права администратора.
This passphrase will not be copied to another device. It will be set to  until you configure it again.: Эта парольная фраза не будет скопирована на другое устройство.
This passphrase will not be copied to another device. It will be set to `Default` until you configure it again.:
  Эта парольная фраза не будет скопирована на другое устройство. Ей будет
  присвоено значение `Default`, пока вы не настроите её снова.
This password is used to encrypt the connection. Use something long enough.: Этот пароль шифрует подключение. Возьмите достаточно длинный.
This procedure will first delete all existing synchronisation data from the server. Following this, the server data will be completely rebuilt, using the current state of your Vault on this device (including its local database) as:
  Сначала все данные синхронизации на сервере будут удалены. Затем данные на
  сервере соберутся заново, а за основу возьмётся текущее состояние хранилища на
  этом устройстве (вместе с локальной базой) как
This setting must be the same even when connecting to multiple synchronisation destinations.:
  Этот параметр должен совпадать даже при подключении к нескольким целям
  синхронизации.
This Vault is empty, or contains only new files that are not on the server.: Это хранилище пустое или содержит только новые файлы, которых нет на сервере.
This will rebuild the local database on this device using the most recent data from the server. This action is designed to resolve synchronisation inconsistencies and restore correct functionality.:
  Локальная база на этом устройстве будет пересобрана по самым свежим данным с
  сервера. Так решаются расхождения синхронизации и восстанавливается правильная
  работа.
This will recreate chunks for all files. If there were missing chunks, this may fix the errors.:
  Это пересоздаст чанки для всех файлов. Если какие-то чанки отсутствовали, это
  может исправить ошибки.
To minimise the creation of new conflicts: Чтобы создавалось меньше новых конфликтов
Transfer Tweak: Настройки передачи
TURN Credential: Пароль TURN
TURN server settings are only necessary if you are behind a strict NAT or firewall that prevents direct P2P connections. In most cases, you can leave these fields blank.:
  Настройки сервера TURN нужны только за строгим NAT или межсетевым экраном,
  который не даёт устройствам соединяться напрямую. Обычно эти поля можно
  оставить пустыми.
TURN Server URLs (comma-separated): Адреса серверов TURN (через запятую)
TURN Username: Имя пользователя TURN
TweakMismatchResolve:
  Action:
    DisableAutoAcceptCompatible: Отключить авто-приём
    Dismiss: Отмена
    EnableAutoAcceptCompatible: Включить авто-приём
    UseConfigured: Использовать настроенные параметры
    UseMine: Обновить настройки удалённой базы данных
    UseMineAcceptIncompatible: Обновить настройки, но оставить как есть
    UseMineWithRebuild: Обновить настройки и перестроить снова
    UseRemote: Применить настройки к этому устройству
    UseRemoteAcceptIncompatible: Применить настройки, но игнорировать несовместимость
    UseRemoteWithRebuild: Применить настройки и загрузить снова
  Message:
    AutoAcceptCompatibleUndefined: >-
      
      Похоже, настройки на устройствах различаются. Совместимые изменения можно
      применять автоматически.

      Включить параметр `auto-accept`?
    Main: >-
      
      Настройки в удалённой базе данных следующие. Эти значения настроены
      другими устройствами, которые хотя бы раз синхронизировались с этим
      устройством.


      Если вы хотите использовать эти настройки, выберите
      %{TweakMismatchResolve.Action.UseConfigured}.

      Если вы хотите сохранить настройки этого устройства, выберите
      %{TweakMismatchResolve.Action.Dismiss}.


      ${table}


      >[!TIP]

      > Если вы хотите синхронизировать все настройки, используйте
      «Синхронизация настроек через Markdown» после применения минимальной
      конфигурации этой функцией.


      ${additionalMessage}
    MainTweakResolving: |-
      Ваша конфигурация не совпадает с конфигурацией на удалённом сервере.

      Следующие параметры должны совпадать:

      ${table}

      Сообщите нам своё решение.

      ${additionalMessage}
