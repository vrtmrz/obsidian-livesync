  msgRebuildRequired: >-
    Требуется перестроение баз данных для применения изменений. Выберите способ
    применения изменений.


    <details>

    <summary>Обозначения</summary>


    | Символ | Значение |

    |: ------ :| ------- |

    | ⇔ | Актуально |

    | ⇄ | Синхронизация для выравнивания |

