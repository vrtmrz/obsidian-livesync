If "Auto Start P2P Connection" is enabled, the P2P connection will be started automatically when the plug-in launches.:
  Если включён параметр «Автозапуск соединения P2P», соединение P2P запускается
  при старте плагина.
If disabled(toggled), chunks will be split on the UI thread (Previous behaviour).: Если отключено, чанки будут разделяться в основном потоке.
If enabled per-filed efficient customization sync will be used. We need a small migration when enabling this.:
  Если включено, будет использоваться эффективная синхронизация настроек для
  каждого файла.
If enabled per-filed efficient customization sync will be used. We need a small migration when enabling this. And all devices should be updated to v0.23.18. Once we enabled this, we lost a compatibility with old versions.:
  Если включено, будет использоваться эффективная синхронизация настроек для
  каждого файла. При включении потребуется небольшая миграция. Все устройства
  должны быть обновлены до v0.23.18. После включения совместимость со старыми
  версиями будет потеряна.
If enabled, chunks will be split into no more than 100 items. However, dedupe is slightly weaker.: Если включено, чанки будут разделены не более чем на 100 элементов.
If enabled, newly created chunks are temporarily kept within the document, and graduated to become independent chunks once stabilised.: Если включено, вновь созданные чанки временно хранятся в документе.
If enabled, the ⛔ icon will be shown inside the status instead of the file warnings banner. No details will be shown.: Если включено, значок будет показан внутри статуса.
If enabled, the file under 1kb will be processed in the UI thread.: Если включено, файлы меньше 1КБ будут обрабатываться в основном потоке.
If enabled, the notification of hidden files change will be suppressed.: Если включено, уведомление об изменении скрытых файлов будет подавлено.
If this enabled, all chunks will be stored with the revision made from its content. (Previous behaviour): Если включено, все чанки будут храниться с ревизией из содержимого.
If this enabled, All files are handled as case-Sensitive (Previous behaviour).: Если включено, все файлы обрабатываются с учётом регистра.
If this enabled, chunks will be split into semantically meaningful segments. Not all platforms support this feature.: Если включено, чанки будут разделены на семантически значимые сегменты.
If this is set, changes to local files which are matched by the ignore files will be skipped.: Если установлено, изменения файлов из списка игнорирования будут пропущены.
If this is set, changes to local files which are matched by the ignore files will be skipped. Remote changes are determined using local ignore files.:
  Если установлено, изменения файлов из списка игнорирования будут пропущены.
  Удалённые изменения определяются по локальным файлам игнорирования.
If this option is enabled, PouchDB will hold the connection open for 60 seconds, and if no change arrives in that time, close and reopen the socket, instead of holding it open indefinitely.: Если эта опция включена, PouchDB будет держать соединение открытым 60 секунд.
If this option is enabled, PouchDB will hold the connection open for 60 seconds, and if no change arrives in that time, close and reopen the socket, instead of holding it open indefinitely. Useful when a proxy limits request duration but can increase resource usage.:
  Если эта опция включена, PouchDB будет держать соединение открытым 60 секунд
  и, если за это время не придёт ни одного изменения, закроет и откроет сокет
  заново, вместо того чтобы держать соединение открытым бесконечно. Полезно,
  когда прокси ограничивает длительность запроса, но может увеличить расход
  ресурсов.
If you cannot avoid CORS issues, you might want to try this option. It uses Obsidian's internal API to communicate with the CouchDB server. Not compliant with web standards, but works. Note that this might break in future Obsidian versions.:
  "Если не удаётся обойти проблемы CORS, попробуйте этот параметр. Он использует
  внутренний API Obsidian для связи с сервером CouchDB. Это не по
  веб-стандартам, но работает. Учтите: в новых версиях Obsidian это может
  перестать работать."
If you cannot avoid CORS issues, you might want to try this option. It uses Obsidian's internal API to communicate with the S3 server. Not compliant with web standards, but works. Note that this might break in future Obsidian versions.:
  "Если не удаётся обойти проблемы CORS, попробуйте этот параметр. Он использует
