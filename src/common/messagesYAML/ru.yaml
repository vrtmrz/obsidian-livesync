    </details>


    ## ${OPTION_REBUILD_BOTH}

    Коротко:  📄 ⇒¹ 💻 ⇒² 🛰️ ⇢ⁿ 💻 ⇄ⁿ⁺¹ 📄

    Перестроить локальную и удалённую базы данных по файлам, которые уже есть на
    этом устройстве.

    Другие устройства будут заблокированы, им потребуется загрузка с удалённого.

    ## ${OPTION_FETCH}

    Коротко: 📄 ⇄² 💻 ⇐¹ 🛰️ ⇔ 💻 ⇔ 📄

    Очистить локальную базу данных и построить её заново по данным, загруженным
    из удалённой базы данных.

    Этот вариант подходит и тогда, когда вы перестроили удалённую базу данных.

