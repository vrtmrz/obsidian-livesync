  fix0256:
    buttons:
      checkItLater: Проверить позже
      DismissForever: Исправлено, больше не спрашивать
      fix: Исправить
    message: >
      Из-за недавней ошибки (в v0.25.6) некоторые файлы могли быть неправильно
      сохранены в базе данных синхронизации.

      Мы проверили файлы и нашли те, которые нужно исправить.


      **Файлы, готовые к исправлению:**


      ${files}


      У этих файлов в хранилище есть исходный файл совпадающего размера, поэтому
      они, скорее всего, восстановимы.

      Мы можем использовать их, чтобы исправить базу данных. Нажмите кнопку
      «Исправить» ниже.


      ${messageUnrecoverable}


      Если вы захотите запустить это снова, вы можете сделать это из Hatch.
    messageUnrecoverable: >
      **Файлы не могут быть исправлены на этом устройстве:**


      ${filesNotRecoverable}


      У этих файлов несогласованные метаданные, и на этом устройстве их
      исправить нельзя (чаще всего мы не можем определить, какие данные верны).

      Чтобы восстановить их, проверьте другие свои устройства (тоже этой
      функцией) или восстановите файлы вручную из резервной копии.
    title: Обнаружены повреждённые файлы
  insecureChunkExist:
    buttons:
      fetch: Я уже перестроил удалённую. Загрузить с удалённой
      later: Сделаю позже
      rebuild: Перестроить всё
    laterMessage: Мы настоятельно рекомендуем обработать это как можно скорее!
    message: Некоторые чанки хранятся небезопасно. Пожалуйста, перестройте базу данных.
    title: Обнаружены небезопасные чанки!
