  logLocalDatabaseNotReady: Что-то пошло не так! Локальная база данных не готова
  logMigratedSameBehaviour: Миграция на db:${current} с тем же поведением, что и раньше
  logMigrationFailed: Миграция не удалась или отменена с ${old} на ${current}
  logRedflag2CreationFail: Не удалось создать redflag2
  logRemoteTweakUnavailable: Не удалось получить удалённые настройки
  logSetupCancelled: Настройка отменена, Self-hosted LiveSync ожидает вашей настройки!
  msgFetchRemoteAgain: Удалённая база данных, похоже, уже была мигрирована.
    Конфигурация этого устройства несовместима.
  msgSinceV02321: >-
    Начиная с v0.23.21, self-hosted LiveSync изменил поведение по умолчанию и
    структуру базы данных. Внесены следующие изменения:


    1. **Чувствительность имён файлов к регистру**
       Теперь имена файлов обрабатываются без учёта регистра. Для большинства платформ это полезное изменение, кроме Linux и iOS, которые плохо работают с регистром имён файлов.
       (На них для файлов с одинаковым именем в разном регистре будет показано предупреждение).

    2. **Обработка ревизий чанков**
       Чанки неизменяемы, поэтому их ревизии можно зафиксировать. Это изменение ускорит сохранение файлов.

    ___Однако, чтобы включить любое из этих изменений, нужно перестроить и
    удалённую, и локальную базы данных. Это занимает несколько минут, и мы
    рекомендуем делать это, когда у вас есть достаточно времени.___


    - Если вы хотите сохранить прежнее поведение, вы можете пропустить этот
    процесс кнопкой `${KEEP}`.

    - Если времени не хватает, выберите `${DISMISS}`. Мы спросим вас позже.

    - Если вы уже перестроили базу данных на другом устройстве, выберите
    `${DISMISS}` и попробуйте синхронизироваться снова. Расхождение обнаружено,
    поэтому вопрос появится снова.
