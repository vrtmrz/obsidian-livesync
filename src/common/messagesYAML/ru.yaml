  logCheckingStorageSizes: Проверка размеров хранилища
  logCurrentStorageSize: "Размер удалённого хранилища: ${measuredSize}"
  logExceededWarning: "Размер удалённого хранилища: ${measuredSize} превысил ${notifySize}"
  logThresholdEnlarged: Порог увеличен до ${size} МБ
  msgConfirmRebuild: Это может занять некоторое время. Вы действительно хотите
    перестроить всё сейчас?
  msgDatabaseGrowing: |
    **Ваша база данных увеличивается!** Но не волнуйтесь, мы можем решить это сейчас. Это время до того, как на удалённом хранилище закончится место.

    | Измеренный размер | Заданный размер |
    | --- | --- |
    | ${estimatedSize} | ${maxSize} |

    > [!MORE]-
    > Если вы пользуетесь плагином много лет, в базе данных могли накопиться чанки без ссылок — то есть мусор. Поэтому мы рекомендуем перестроить всё. Вероятно, база станет намного меньше.
    >
    > Если объём вашего хранилища просто растёт, лучше перестроить всё после наведения порядка в файлах. Self-hosted LiveSync не удаляет сами данные, даже если вы их удалили, — так работа идёт быстрее. Это в общих чертах [описано в документации](https://github.com/vrtmrz/obsidian-livesync/blob/main/docs/tech_info.md).
    >
    > Если рост вас не смущает, вы можете увеличить порог уведомления на 100 МБ. Так стоит делать, если вы работаете на своём сервере. Но время от времени всё же лучше перестраивать всё.
    >

    > [!WARNING]
    > Если вы перестраиваете всё, убедитесь, что все устройства синхронизированы. Впрочем, плагин объединит столько, сколько сможет.
