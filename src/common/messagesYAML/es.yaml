  Message:
    AutoAcceptCompatibleUndefined: >-
      
      Parece que los ajustes son distintos en cada dispositivo. Ahora se pueden
      aplicar automáticamente los cambios compatibles a estas configuraciones.

      ¿Quieres activar la aceptación automática (`auto-accept`)?
    Main: >-
      
      Los ajustes de la base de datos remota son los siguientes. Los han
      configurado otros dispositivos que se han sincronizado con este al menos
      una vez.


      Si quieres usar estos ajustes, selecciona
      %{TweakMismatchResolve.Action.UseConfigured}.

      Si prefieres conservar los de este dispositivo, selecciona
      %{TweakMismatchResolve.Action.Dismiss}.


      ${table}


      >[!TIP]

      > Si quieres sincronizar todos los ajustes, usa «Sync settings via
      markdown» después de aplicar la configuración mínima con esta función.


      ${additionalMessage}
    MainTweakResolving: |-
      Tu configuración no coincide con la del servidor remoto.

      La siguiente configuración debería coincidir:

      ${table}

      Indícanos qué decides.

      ${additionalMessage}
    UseRemote:
      WarningRebuildRecommended: >-
        
        >[!NOTICE]

        > Algunos cambios son compatibles, pero pueden consumir almacenamiento y
        transferencia de más. Se recomienda reconstruir. De momento puede que no
        se reconstruya, pero podría hacerse en un mantenimiento futuro.

        > ***Asegúrate de tener tiempo y una red estable antes de aplicarlo.***
      WarningRebuildRequired: >-
        
        >[!WARNING]

        > Algunas configuraciones remotas no son compatibles con la base de
        datos local de este dispositivo. Habrá que reconstruirla.

        > ***Asegúrate de tener tiempo y una red estable antes de aplicarlo.***
    WarningIncompatibleRebuildRecommended: >-
      
      >[!NOTICE]

      > Hemos detectado que algunos valores difieren de forma que hacen
      incompatible la base de datos local con la remota.

      > Algunos cambios son compatibles, pero pueden consumir almacenamiento y
      transferencia de más. Se recomienda reconstruir. De momento puede que no
      se reconstruya, pero podría hacerse en un mantenimiento futuro.

      > Si decides reconstruir, tardará unos minutos o más. **Asegúrate de que
      es seguro hacerlo ahora.**
    WarningIncompatibleRebuildRequired: >-
      
      >[!WARNING]

      > Hemos detectado que algunos valores difieren de forma que hacen
      incompatible la base de datos local con la remota.

      > Hay que reconstruir la local o la remota. Ambas cosas tardan unos
      minutos o más. **Asegúrate de que es seguro hacerlo ahora.**
