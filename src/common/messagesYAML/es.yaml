  Apply:
    Buttons:
      ApplyAndFetch: Aplicar y obtener
      ApplyAndMerge: Aplicar y combinar
      ApplyAndRebuild: Aplicar y reconstruir
      Cancel: Descartar y cancelar
      OnlyApply: Solo aplicar
    Message: >-
      La nueva configuración está lista. Vamos a aplicarla.

      Hay varias formas de hacerlo:


      - Aplicar y obtener
        Configura este dispositivo como cliente nuevo. Tras aplicarla, sincroniza desde el servidor remoto.
      - Aplicar y combinar
        Para un dispositivo que ya tiene los archivos. Procesa los archivos locales y transfiere las diferencias. Pueden surgir conflictos.
      - Aplicar y reconstruir
        Reconstruye el remoto a partir de los archivos locales. Se hace normalmente si el servidor se ha corrompido o si se quiere empezar de cero.
        Los demás dispositivos quedarán bloqueados y tendrán que volver a obtener los datos.
      - Solo aplicar
        Solo aplica la configuración. Pueden surgir conflictos si hace falta reconstruir.
    Title: Aplicar la nueva configuración de ${method}
    WarningRebuildRecommended: "NOTA: tras ajustar la configuración se ha
      determinado que hace falta reconstruir; no se recomienda «solo importar»."
  Doctor:
    Buttons:
      No: No, usar los ajustes del URI tal cual
      Yes: Sí, consultar al doctor
    Message: >-
      Self-hosted LiveSync tiene ya una historia larga y algunos ajustes
      recomendados han cambiado.


      La configuración inicial es un momento muy bueno para revisarlos.


      ¿Quieres ejecutar el Doctor para comprobar si los ajustes importados son
      los óptimos respecto al estado actual?
    Title: ¿Quieres consultar al doctor?
  FetchRemoteConf:
    Buttons:
      Fetch: Sí, obtener la configuración
      Skip: No, usar los ajustes del URI
    Message: >-
      Si ya hemos sincronizado alguna vez con otro dispositivo, la base de datos
      remota guarda los valores de configuración adecuados para los dispositivos
      sincronizados. El complemento querría recuperarlos para lograr una
      configuración más sólida.


      Antes hay que asegurar una cosa: ¿estamos en una situación en la que se
      puede acceder a la red de forma segura y recuperar los ajustes?


      Nota: normalmente puedes hacerlo sin riesgo si tu base de datos remota se
      sirve con un certificado SSL y tu red no está comprometida.
    Title: ¿Obtener la configuración de la base de datos remota?
  QRCode: >-
    Hemos generado un código QR para transferir los ajustes. Escanéalo con tu
