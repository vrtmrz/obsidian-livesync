      ProceedExisting: Sí, quiero añadir este dispositivo a mi sincronización existente
      ProceedNew: Sí, quiero configurar una sincronización nueva
      Question: Primero, selecciona la opción que mejor describa tu situación actual.
      Title: Bienvenido a Self-hosted LiveSync
    Invitation:
      Start: Comenzar la configuración
    OutroAskUserMode:
      CompatibleOption: El remoto ya está configurado y la configuración es compatible
        (o pasa a serlo con esta operación).
      CompatibleOptionDesc: Si no estás seguro, elegir esta opción es arriesgado. Da
        por supuesto que la configuración del servidor es compatible con este
        dispositivo. Si no lo es, puede haber pérdida de datos. Asegúrate de
        entender las consecuencias.
      ExistingOption: Mi servidor remoto ya está configurado. Quiero añadir este dispositivo.
      ExistingOptionDesc: Al elegir esta opción, este dispositivo se unirá al servidor
        existente. Tendrás que obtener del servidor los datos de sincronización
        ya existentes.
      Guidance: La conexión con el servidor se ha configurado correctamente. Como paso
        siguiente hay que reconstruir la base de datos local, es decir, la
        información de sincronización.
      NewOption: Estoy configurando un servidor nuevo por primera vez / quiero
        restablecer mi servidor actual.
      NewOptionDesc: Al elegir esta opción, el servidor se inicializará con los datos
        actuales de este dispositivo. Cualquier dato existente en el servidor se
        sobrescribirá por completo.
      ProceedApplySettings: Aplicar los ajustes
      ProceedNext: Continuar al paso siguiente.
      Question: Selecciona tu situación.
      Title: "Casi terminado: se requiere una decisión"
    OutroNewP2PUser:
      GuidanceNotice: En P2P no hay una copia en un servidor central que sobrescribir.
        Este paso prepara solo este dispositivo; mantenlo conectado cuando otro
        dispositivo obtenga sus datos iniciales.
      GuidancePrimary: La conexión punto a punto se ha configurado correctamente. A
        continuación, la base de datos local de LiveSync se construirá a partir
        de los archivos actuales de este Vault.
      Important: TEN EN CUENTA
      Proceed: Reiniciar y preparar este dispositivo
      Question: Pulsa el botón de abajo para reiniciar y pasar a la confirmación de la
        inicialización local.
      Title: "Configuración completada: preparando este dispositivo P2P"
    OutroNewUser:
      GuidancePrimary: La conexión con el servidor se ha configurado correctamente.
        Como paso siguiente, los datos de sincronización del servidor se
        construirán a partir de los datos actuales de este dispositivo.
      GuidanceWarning: Tras reiniciar, los datos de este dispositivo se subirán al
        servidor como copia maestra. Ten en cuenta que cualquier dato no deseado
        que haya ahora en el servidor se sobrescribirá por completo.
      Important: IMPORTANTE
      Proceed: Reiniciar e inicializar el servidor
      Question: Pulsa el botón de abajo para reiniciar y pasar a la confirmación final.
      Title: "Configuración completada: preparando la inicialización del servidor"
    RebuildEverythingP2P:
      ConfirmLocalReset: Entiendo que esto restablece únicamente la base de datos de
        sincronización local de este dispositivo.
      ConfirmLocalResetNote: Se usarán los archivos que hay ahora en este Vault para reconstruirla.
      ConfirmTitle: ⚠️ Confirma lo siguiente
      Guidance: Este procedimiento descartará la base de datos local de LiveSync de
        este dispositivo y la reconstruirá a partir de los archivos actuales de
        este Vault. No elimina ni sobrescribe datos de otro dispositivo.
      Note: Mantén este dispositivo conectado después de la inicialización para que
        otro dispositivo pueda obtener el Vault desde él.
      Proceed: Lo entiendo, preparar este dispositivo
      Title: "Confirmación final: preparar este dispositivo para P2P"
    SelectExisting:
      Guidance: Estás añadiendo este dispositivo a una configuración de sincronización
        existente.
      ManualOption: Configurar un remoto manualmente
      ManualOptionDesc: Vuelve a configurar manualmente el mismo remoto que en tus
        otros dispositivos. Está pensado solo para usuarios avanzados.
      ProceedManual: Continuar con la configuración manual
      ProceedQr: Escanea con la cámara de este dispositivo el código QR mostrado en un
        dispositivo activo.
      ProceedSetupUri: Continuar con el Setup URI
      QrOption: Escanear un código QR (recomendado en móvil)
      QrOptionDesc: Escanea con la cámara de este dispositivo el código QR mostrado en
        un dispositivo activo.
      Question: Selecciona un método para importar los ajustes desde otro dispositivo.
      SetupUriOption: Usar un Setup URI (recomendado)
      SetupUriOptionDesc: Pega el Setup URI generado en uno de tus dispositivos activos.
      Title: Método de configuración del dispositivo
    SelectNew:
      Guidance: Vamos a configurar la conexión de sincronización.
      ManualOption: Configurar un remoto manualmente
      ManualOptionDesc: Es una opción avanzada para quienes no tienen un Setup URI o
        quieren ajustar la configuración en detalle. También puedes usarla para
        la sincronización P2P en lugar de CouchDB o de un almacenamiento de
        objetos compatible con S3.
      ProceedManual: Continuar con la configuración manual
      ProceedSetupUri: Continuar con el Setup URI
      Question: ¿Cómo quieres configurar esta conexión de sincronización?
      SetupUriOption: Usar un Setup URI (recomendado)
      SetupUriOptionDesc: Un Setup URI es una única cadena que contiene los datos de
        conexión y autenticación. Cuando un script de instalación te proporciona
        uno, es la forma más sencilla y segura de configurarlo.
      Title: Método de conexión
    SetupRemote:
      BucketOption: Almacenamiento de objetos compatible con S3
      BucketOptionDesc: Sincronización mediante archivos de diario. Necesitas tener ya
        un servicio de almacenamiento de objetos compatible con S3, como Amazon
        S3, MinIO o Cloudflare R2.
      CouchDbOptionDesc: Es el método de sincronización más adecuado para el diseño
        actual y ofrece todas las funciones. Necesitas tener ya una instancia de
        CouchDB en marcha.
      Guidance: Selecciona el tipo de remoto para esta configuración de sincronización.
      P2POption: Punto a punto (P2P)
      P2POptionDesc: Permite la sincronización directa entre dispositivos. No hace
        falta servidor, pero ambos dispositivos deben estar conectados a la vez
        y algunas funciones pueden estar limitadas. Solo se necesita internet
        para la señalización, no para transferir los datos.
      ProceedBucket: Continuar con la configuración del almacenamiento de objetos
      ProceedCouchDb: Continuar con la configuración de CouchDB
      ProceedP2P: Continuar con la configuración de P2P
      Title: Elige un remoto de sincronización
