  Note:
    Summary: ¿Qué es esta función? (incluye notas importantes; léelas al menos una vez)
    description: >2-
       Este replicador permite sincronizar el vault con otros dispositivos
      mediante una conexión punto a punto. Así se puede sincronizar con nuestros
      otros dispositivos sin usar un servicio en la nube.

      El replicador se basa en Trystero. Usa además un servidor de señalización
      para establecer la conexión entre dispositivos. Ese servidor sirve para
      intercambiar la información de conexión y no conoce (ni debería almacenar)
      ninguno de nuestros datos.


      Cualquiera puede alojar el servidor de señalización: es simplemente un
      relé Nostr. Por comodidad y para poder comprobar el comportamiento del
      replicador, vrtmrz aloja una instancia. Puedes usar ese servidor
      experimental o cualquier otro.


      Por cierto, aunque el servidor de señalización no almacene nuestros datos,
      sí puede ver la información de conexión de algunos de nuestros
      dispositivos. Tenlo en cuenta y ten precaución al usar un servidor de
      terceros.
    important_note: Replicador punto a punto.
    important_note_sub: Esta función sigue siendo muy experimental. Asegúrate de
      tener una copia de seguridad de tus datos antes de usarla. Y nos alegraría
      mucho que quisieras contribuir a su desarrollo.
