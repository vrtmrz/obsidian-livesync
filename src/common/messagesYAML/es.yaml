RedFlag:
  Fetch:
    Method:
      Desc: >-
        ¿Cómo quieres obtener los datos?

        - %{RedFlag.Fetch.Method.FetchSafer}.
          **Poco tráfico**, **mucha CPU**, **riesgo bajo**
          Recomendado si...
          - Los archivos podrían ser inconsistentes
          - No hay demasiados archivos
        - %{RedFlag.Fetch.Method.FetchSmoother}.
          **Poco tráfico**, **CPU moderada**, **riesgo bajo o moderado**
          Recomendado si...
          - Los archivos son probablemente consistentes
          - Tienes muchos archivos
        - %{RedFlag.Fetch.Method.FetchTraditional}.
          **Mucho tráfico**, **poca CPU**, **riesgo bajo o moderado**

        >[!INFO]- Detalles

        > ## %{RedFlag.Fetch.Method.FetchSafer}.

        > **Poco tráfico**, **mucha CPU**, **riesgo bajo**

        > Esta opción crea primero una base de datos local a partir de los
        archivos locales existentes antes de obtener los datos del remoto.

        > Si un archivo existe tanto en local como en remoto, solo se
        transferirán las diferencias.

        > Sin embargo, los archivos presentes en ambos sitios se tratarán
        inicialmente como archivos en conflicto. Se resolverán automáticamente
        si en realidad no lo están, pero el proceso puede tardar.

        > En general es el método más seguro y el que menos riesgo de pérdida de
        datos conlleva.

        > ## %{RedFlag.Fetch.Method.FetchSmoother}.

        > **Poco tráfico**, **CPU moderada**, **riesgo bajo o moderado** (según
        la operación)

        > Esta opción crea primero los chunks de los archivos locales para la
        base de datos y después obtiene los datos. Así solo se transfieren los
        chunks que faltan en local. Aun así, todos los metadatos se toman del
        remoto.

        > Al iniciar, los archivos locales se comparan con esos metadatos. El
        contenido considerado más reciente sobrescribirá al más antiguo (según
        la fecha de modificación) y el resultado se sincroniza de vuelta a la
        base de datos remota.

        > Es seguro si los archivos locales son realmente los de fecha más
        reciente, pero puede dar problemas si un archivo tiene una fecha más
        nueva y un contenido más antiguo (como el `welcome.md` inicial).

        > Usa menos CPU y es más rápido que
        «%{RedFlag.Fetch.Method.FetchSafer}», pero puede provocar pérdida de
        datos si no se usa con cuidado.

        > ## %{RedFlag.Fetch.Method.FetchTraditional}.

        > **Mucho tráfico**, **poca CPU**, **riesgo bajo o moderado** (según la
        operación)

        > Se obtiene todo del remoto.

        > Similar a %{RedFlag.Fetch.Method.FetchSmoother}, pero todos los chunks
        se descargan del remoto.

        > Es la forma más tradicional de obtener los datos y normalmente la que
        más tráfico y tiempo consume. Conlleva un riesgo de sobrescribir
        archivos remotos parecido al de «%{RedFlag.Fetch.Method.FetchSmoother}».

        > Aun así, suele considerarse el método más estable, por ser el más
        antiguo y directo.
      FetchSafer: Crear una base de datos local antes de obtener los datos
      FetchSmoother: Crear los chunks de los archivos locales antes de obtener los datos
      FetchTraditional: Obtener todo del remoto
      Title: ¿Cómo quieres obtener los datos?
