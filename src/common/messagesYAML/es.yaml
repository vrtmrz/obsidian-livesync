Replicator:
  Dialogue:
    Locked:
      Action:
        Dismiss: Cancelar para volver a confirmarlo
        Fetch: Restablecer la sincronización en este dispositivo
        Unlock: Desbloquear la base de datos remota
      Message:
        _value: >
          La base de datos remota está bloqueada porque se ha reconstruido en
          uno de los dispositivos.

          Por eso se pide a este dispositivo que no se conecte, para evitar
          corromper la base de datos.


          Hay tres opciones posibles:


          - %{Replicator.Dialogue.Locked.Action.Fetch}
            La más recomendable y fiable. Descarta la base de datos local y vuelve a tomar toda la información de sincronización del remoto. En la mayoría de los casos se puede hacer sin riesgo, aunque lleva algo de tiempo y conviene hacerlo con una red estable.
          - %{Replicator.Dialogue.Locked.Action.Unlock}
            Solo se puede usar si ya estamos sincronizados de forma fiable por otros métodos de replicación. Esto no significa simplemente tener los mismos archivos. Si no estás seguro, evítala.
          - %{Replicator.Dialogue.Locked.Action.Dismiss}
              Cancela la operación. Se volverá a preguntar en la próxima solicitud.
        Fetch: Se ha programado la obtención completa. El complemento se reiniciará para
