TweakMismatchResolve:
  Action:
    DisableAutoAcceptCompatible: Desactivar la aceptación automática
    Dismiss: Descartar
    EnableAutoAcceptCompatible: Activar la aceptación automática
    UseConfigured: Usar los ajustes configurados
    UseMine: Actualizar los ajustes de la base de datos remota
