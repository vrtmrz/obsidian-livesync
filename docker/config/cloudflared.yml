# cloudflared tunnel configuration for Self-hosted LiveSync
# =============================================================================
#
# Prerequisites:
#   1. Create a remotely managed tunnel using the current Cloudflare dashboard guide.
#   2. Copy the tunnel token to CF_TUNNEL_TOKEN in your .env
#   3. Add a published application route in the dashboard:
#       Hostname : couchdb.yourdomain.com   (or whatever you set COUCHDB_DOMAIN to)
#       Service  : http://couchdb:5984
#
# The token-managed Compose profile uses dashboard routing. The local ingress
# example below describes locally managed routing and is not that profile's
# source of routes. Diagnose 524 errors using current Cloudflare guidance.
# The Obsidian Request API setting changes the HTTP adapter, not the sync mode.
#
# =============================================================================

tunnel: ${CF_TUNNEL_ID}
credentials-file: /etc/cloudflared/credentials.json

ingress:
  - hostname: ${COUCHDB_DOMAIN}
    service: http://couchdb:5984
    originRequest:
      # Origin connection settings for this locally managed example
      connectTimeout: 30s
      keepAliveTimeout: 90s
      keepAliveConnections: 100
      noTLSVerify: false
  - service: http_status:404
